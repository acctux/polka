tls cloudflare {
    remote-hostname "one.one.one.one";
};
options {
    directory "/var/named";
    listen-on { 127.0.0.1; };
    listen-on-v6 { ::1; };
    allow-recursion {
        127.0.0.1;
        ::1;
    };
    forward only;
    forwarders port 853 tls cloudflare {
        1.1.1.1;
        1.0.0.1;
        2606:4700:4700::1111;
        2606:4700:4700::1001;
    };
};
